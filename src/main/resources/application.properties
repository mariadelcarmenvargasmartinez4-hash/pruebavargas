# Configuracion del servidor
server.port=8088

# Deshabilitar Spring Cloud Config server en local
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Configuracion de base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/db_prueba
spring.datasource.username=postgres
spring.datasource.password=postgres

# Configuracion Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# Configuracion GestoPago
gestopago.auth.url=https://api.gestopago.com
gestopago.auth.id-distribuidor=12345
gestopago.auth.codigo-dispositivo=DISP001
gestopago.auth.password=password123
gestopago.auth.refresh-rate-ms=3600000

# Configuracion servicio externo de productos
productos.api.url=https://gestopago.portalventas.net
productos.api.token=qmzAAEYFmqQbIT/Ktxme8FDV343iYQPwVJM4T39cEinWq1yjc1pp9oxSo4Rjmo5Fk27YzkCDaCr5RM4xtGZNCBZk1MH1tMNbykJ/WzfVjxSEXc9FERnZJPsVuFcAgfsfHmEYEfsLSmLZgovuGmnpDA==
productos.api.connect-timeout-ms=5000
productos.api.read-timeout-ms=5000

# Timeouts Feign para productoClient y gestoPagoProductClient
feign.client.config.productoClient.connect-timeout=5000
feign.client.config.productoClient.read-timeout=5000
feign.client.config.gestoPagoProductClient.connect-timeout=5000
feign.client.config.gestoPagoProductClient.read-timeout=5000

# Configuracion MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/db_servicios

# Programacion Cron diaria a las 06:00 AM
productos.cron=0 0 6 * * ?
